<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma Studio</title>

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-left">
        <a href="./index.html" class="home-button-container">
          <p class="header__headline-bold">Luma</p>
          <p class="header__headline-light">Studio</p>
        </a>
      </div>
      <div class="header-right">
        <button class="liked-products">
          <img class="liked-products-icon" src="./assets/icons/liked-products.svg" alt="" />
        </button>
        <button class="shopping-bag">
          <img class="shopping-bag-icon" src="./assets/icons/shopping-bag.svg" alt="Shopping bag" />
          <div class="badge"></div>
        </button>
      </div>
    </header>

    <main class="main-container">
      <!-- Checkout  -->
      <div class="checkout-container">
        <div class="checkout-container__content">
          <img class="exit-icon" src="./assets/icons/exit-icon.svg" alt="Leave register" />
          <div class="checkout-container-top">
            <div class="checkout-headline">Summary</div>
          </div>
          <div class="checkout-container-main-content"></div>
          <div class="checkout-container-bottom">
            <div class="total-price">Total sum:</div>
            <a href=""><button class="checkout-page__button">Go to checkout</button></a>
          </div>
        </div>
      </div>

      <section class="hero-section">
        <div class="hero-top">
          <h1>Lys,</h1>
          <p class="hero-headline-light">uten støy</p>
        </div>

        <div class="hero-bottom">
          <p>Der lys og form finner balanse</p>
        </div>
      </section>

      <div class="selection-container">
        <div class="section-headline-container">
          <h2>Vår katalog</h2>
        </div>

        <div class="selections">
          <div class="filter">
            <button class="filter-button">Alle lamper</button>
            <button class="filter-button">Bordlampe</button>
            <button class="filter-button">Taklampe</button>
            <button class="filter-button">Stålampe</button>
          </div>
          <div class="toggle-holder">
            <label for="light">Lys</label>
            <div class="component" data-component-name="toggle-button">
              <label class="switch">
                <input id="toggle" type="checkbox" />
                <span class="slider round"></span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <section class="content-container" id="products"></section>
    </main>

    <footer>
      <div class="footer-text">
        This site is created as a study project by
        <b>Ida Holmen Skjervold</b>
      </div>
      <div>
        Reach out to me at e-mail
        <b>idaaholmen@gmail.com</b>
        or check out the code at
        <a class="github-link" href="https://github.com/IdaHolmen/231107-main-project">Github.</a>
      </div>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
